<div class="d-flex">

  <!-- Sidebar -->
  <div [class]="isCollapsed ? 'sidebar collapsed' : 'sidebar'">

    <!-- Logo & Toggle -->
    <div class="sidebar-header d-flex justify-content-between align-items-center p-3">
      <h5 class="text-white m-0" *ngIf="!isCollapsed">Admin Panel</h5>
      <button class="btn btn-sm text-white toggle-btn" (click)="toggleSidebar()">
        <i class="fas" [ngClass]="isCollapsed ? 'fa-bars' : 'fa-times'"></i>
      </button>
    </div>

    <!-- Navigation -->
    <ul class="nav flex-column mt-3">

      <li class="nav-item">
        <a class="nav-link" routerLink="/dashboard">
          <i class="fas fa-home me-2"></i>
          <span *ngIf="!isCollapsed">Dashboard</span>
        </a>
      </li>

      <li class="nav-item">
        <a class="nav-link" routerLink="/employees">
          <i class="fas fa-users me-2"></i>
          <span *ngIf="!isCollapsed">Employees</span>
        </a>
      </li>

      <li class="nav-item">
        <a class="nav-link" routerLink="/department">
          <i class="fas fa-building me-2"></i>
          <span *ngIf="!isCollapsed">Departments</span>
        </a>
      </li>

      <li class="nav-item">
        <a class="nav-link" routerLink="/designation">
          <i class="fas fa-chart-line me-2"></i>
          <span *ngIf="!isCollapsed">Designation</span>
        </a>
      </li>

      <li class="nav-item mt-auto">
        <a class="nav-link logout" routerLink="/login">
          <i class="fas fa-sign-out-alt me-2"></i>
          <span *ngIf="!isCollapsed">Logout</span>
        </a>
      </li>

    </ul>
  </div>

  <!-- Main Content Area -->
  <div class="content p-4 w-100">
    <router-outlet></router-outlet>
  </div>

</div>
