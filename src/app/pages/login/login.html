<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login Page</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

 
  <style>
    body {
      height: 100vh;
      background: linear-gradient(135deg, #667eea, #764ba2);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', sans-serif;
    }

    .login-card {
      width: 100%;
      max-width: 400px;
      padding: 30px;
      border-radius: 20px;
      background: white;
      box-shadow: 0 15px 35px rgba(0,0,0,0.2);
      transition: transform 0.3s ease;
    }

    .login-card:hover {
      transform: translateY(-5px);
    }

    .form-control:focus {
      box-shadow: none;
      border-color: #764ba2;
    }

    .btn-custom {
      background: #764ba2;
      color: white;
      border-radius: 50px;
      transition: 0.3s;
    }

    .btn-custom:hover {
      background: #667eea;
      transform: scale(1.05);
    }

    .form-floating label {
      color: #6c757d;
    }

    .login-title {
      font-weight: 600;
      color: #764ba2;
    }

    .extra-links a {
      text-decoration: none;
      color: #764ba2;
      font-size: 14px;
    }

    .extra-links a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <div class="login-card animate__animated animate__fadeInDown">
    
    <div class="text-center mb-4">
      <h3 class="login-title">Welcome Back</h3>
      <p class="text-muted small">Please login to your account</p>
    </div>

    <form>
      
      <div class="form-floating mb-3">
        <input type="email" [(ngModel)]="loginObj.email" name="email" class="form-control" id="email" placeholder="name@example.com">
        <label for="email">Email address</label>
      </div>

      <div class="form-floating mb-3">
        <input type="password" [(ngModel)]="loginObj.contactNo" name="contactNo"  class="form-control" id="password" placeholder="Password">
        <label for="password">Contact No</label>
      </div>

      <!-- <div class="d-flex justify-content-between mb-3">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="remember">
          <label class="form-check-label small" for="remember">
            Remember me
          </label>
        </div>
        <a href="#" class="small">Forgot Password?</a>
      </div> -->

      <div class="d-grid">
        <button type="button"(click)="onLogin()" class="btn btn-custom">Login</button>
      </div>

      <div class="text-center mt-3 extra-links">
        <span class="small">Don't have an account?</span>
        <a href="#"> Sign Up</a>
      </div>

    </form>

  </div>

  
</body>
</html>
