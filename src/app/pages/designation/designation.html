<div class="container mt-4">
  <h3>Designation Master</h3>

  <!-- FORM -->
  <div class="card p-3 mb-3">
    <div class="row">

      <div class="col-md-3">
        <label class="form-label">Department</label>
        <select class="form-select" [(ngModel)]="newDesigObj.departmentId">
          <option [value]="0">-- Select Department --</option>
          <option *ngFor="let dept of deptList()" [value]="dept.departmentId">
            {{ dept.departmentName }}
          </option>
        </select>
      </div>

      <div class="col-md-4">
        <label class="form-label">Designation Name</label>
        <input type="text"
               class="form-control"
               [(ngModel)]="newDesigObj.designationName">
      </div>

      <div class="col-md-3 d-flex align-items-end">
        <button class="btn btn-primary me-2"
                (click)="onSaveDesignation()"
                *ngIf="newDesigObj.designationId == 0">
          Save
        </button>

        <button class="btn btn-warning me-2"
                (click)="onUpdateDesignation()"
                *ngIf="newDesigObj.designationId != 0">
          Update
        </button>

        <button class="btn btn-secondary" (click)="onReset()">
          Reset
        </button>
      </div>

    </div>
  </div>

  <!-- TABLE -->
  <div class="card">
    <div class="card-body">
      <table class="table table-bordered table-striped">
        <thead class="table-dark">
          <tr>
            <th>Id</th>
            <th>Department</th>
            <th>Designation Name</th>
            <th width="150">Action</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let item of designationList()">
            <td>{{ item.designationId }}</td>

            <!-- ✅ Pipe hataya, method use kiya -->
            <td>{{ getDeptName(item.departmentId) }}</td>

            <td>{{ item.designationName }}</td>
            <td>
              <button class="btn btn-warning btn-sm me-2" (click)="onEdit(item)">Edit</button>
              <button class="btn btn-danger btn-sm" (click)="onDelete(item.designationId)">Delete</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

</div>
